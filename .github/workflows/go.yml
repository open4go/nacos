name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true

      - name: Show Go version
        run: |
          go version
          go env GOPATH
          go env GOROOT

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # 安全检查
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" -test=false ./...

      # 代码质量检查
      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2

      - name: Show golangci-lint version
        run: |
          "$(go env GOPATH)/bin/golangci-lint" version

      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=10m

      # Build
      - name: Build
        run: |
          go build -v ./...

      # Test
      - name: Test
        # 包的 init() 会根据 NACOS_HOST / NACOS_PORT 创建 Nacos 客户端，配置为空时会 panic；
        # 这里给一个占位地址，仅用于让包能初始化（不会真正连接），集成测试需 NACOS_E2E=1 才运行
        env:
          NACOS_HOST: 127.0.0.1
          NACOS_PORT: "8848"
        run: |
          go test -v ./...